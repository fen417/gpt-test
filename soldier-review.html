<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>SECTOR 09 · Просмотр анимаций</title>
<link rel="stylesheet" href="./src/soldier-review.css">
</head>
<body>
<header><strong class="brand">SECTOR 09</strong><h1>Просмотр анимаций</h1></header>
<main>
  <aside id="toolbar" aria-label="Параметры просмотра">
    <section>
      <h2>Поза и оружие</h2>
      <label>Бойцы <select id="team"><option value="both">Обе команды</option><option value="0">Регулярная армия</option><option value="1">Полевые силы</option></select></label>
      <label>Оружие <select id="weapon"></select></label>
      <label>Режим <select id="source"><option value="game">В игре · с оружием</option><option value="clip">Исходный клип · без оружия</option></select></label>
      <label id="game-animation">Анимация <select id="state"></select></label>
      <label id="raw-animation" hidden>Клип <select id="clip"></select></label>
      <label id="secondary-weapon" hidden>Смена на <select id="sidearm"></select></label>
      <div id="aim-controls" hidden>
        <label>Поворот прицела <input type="range" id="aim-yaw" min="-40" max="40" value="0"></label>
        <label>Наклон прицела <input type="range" id="aim-pitch" min="-35" max="35" value="0"></label>
      </div>
    </section>
    <section>
      <h2>Камера</h2>
      <label>Ракурс <select id="view"><option value="perspective">Три четверти</option><option value="front">Спереди</option><option value="side">Справа</option><option value="left">Слева</option><option value="back">Сзади</option><option value="top">Сверху</option></select></label>
      <label>Приближение <select id="focus"><option value="body">В полный рост</option><option value="weapon">Оружие и руки</option><option value="right">Правая кисть</option><option value="left">Левая кисть</option></select></label>
      <button id="reset-camera" type="button">Сбросить камеру</button>
      <p class="hint">Перетаскивание вращает камеру. Колесо приближает.</p>
    </section>
    <details>
      <summary>Параметры симуляции</summary>
      <label>LOD <select id="lod"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
      <label>Число бойцов <select id="count"><option>2</option><option>10</option><option>20</option><option>32</option></select></label>
      <label>Симуляция, Гц <select id="fps"><option>60</option><option>30</option><option>120</option></select></label>
      <label>Скорость движения <select id="speed"><option value="0.65">0,65×</option><option value="1" selected>1×</option><option value="1.2">1,2×</option></select></label>
      <label class="check"><input type="checkbox" id="remote"> Имитировать снимки 20 Гц</label>
      <label class="check"><input type="checkbox" id="diagnostics"> Записывать опорные фазы</label>
    </details>
  </aside>
  <div class="workspace">
    <div id="viewport" aria-label="Трёхмерный просмотр">
      <div id="team-labels" aria-hidden="true"></div>
      <p id="loading" role="status">Загрузка моделей…</p>
    </div>
    <footer aria-label="Воспроизведение">
      <div class="transport">
        <button id="restart" type="button" title="В начало">↺ <span>В начало</span></button>
        <button id="previous-frame" type="button" title="Кадр назад" aria-label="Кадр назад">◀</button>
        <button id="play-toggle" type="button" aria-keyshortcuts="Space">Пауза</button>
        <button id="next-frame" type="button" title="Кадр вперёд" aria-label="Кадр вперёд">▶</button>
        <label>Темп <select id="playback" aria-label="Темп воспроизведения"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
        <input type="checkbox" id="pause" hidden aria-hidden="true">
        <output id="info"></output>
      </div>
      <div class="timeline">
        <input type="range" id="seek" min="0" max="4" value="0" step=".001" aria-label="Время анимации">
        <output id="time">0,00 с</output>
      </div>
    </footer>
  </div>
</main>
<script type="module" src="./src/soldier-review.js"></script>
</body>
</html>
