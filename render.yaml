# Optional dedicated multiplayer server. Creating this Blueprint is a separate
# action in your Render account; this file does not provision any resources.
services:
  - type: web
    name: gpt-test-sector-09
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '8080'
      - key: BOTS
        value: '12'
      - key: MAX_PLAYERS
        value: '16'
