<!doctype html>
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>SECTOR 09 weathering smoke</title></head>
<body style="margin:0;background:#000"><canvas id="probe" style="display:block;width:480px;height:320px"></canvas>
<script type="module">
import * as THREE from 'three';
import {WebGPURenderer,MeshStandardNodeMaterial} from 'three/webgpu';
import {makeWeatherMask,weatherParameters} from '../src/map-weathering.js';
import {setWebGlWeathering} from '../src/webgl-map-weathering.js';
import {setWebGpuWeathering} from '../src/webgpu-map-weathering.js';
import {WaterAppearance} from '../src/water-appearance.js';
import {graphicsEffects,gradeParameters} from '../src/graphics-settings.js';
import {PostPass} from '../src/post-pass.js';
import {WebGpuPostPass} from '../src/webgpu-post-pass.js';
import {getMap} from '../shared/world.js';
import {bakeProbeField,makeProbeTexture,probeUniforms} from '../src/gi-probes.js';
import {setWebGlGI} from '../src/webgl-gi.js';
import {setWebGpuGI} from '../src/webgpu-gi.js';
import {makeSky} from '../src/visuals.js';
import {makeWebGpuSky} from '../src/webgpu-sky.js';
import {atmosphereProfile} from '../src/atmosphere-profile.js';
import {EffectLights} from '../src/effect-lights.js';
import {makeParticleTexture} from '../src/effect-art.js';
import {createWebGpuSmokeMaterial} from '../src/webgpu-smoke.js';
import {webGpuCampaignFlame} from '../src/webgpu-campaign-fire.js';
const canvas=document.getElementById('probe');
let renderer,scene,camera,materials,mask,apply,device,lost,software=false,errors=[],waterScene,waterCamera,waterRoot,waterAppearance,waterPost,waterSun,fxScene,fxCamera,fxLights,fxParticles;
const instanceDropped=error=>/Instance dropped in popErrorScope|external Instance reference no longer exists|GPU device (?:was )?lost/i.test(String(error));
const tick=()=>new Promise(resolve=>requestAnimationFrame(resolve));
window.initWeatherSmoke=async (api,softwareAdapter=false)=>{
  if(api==='webgpu'){
    const adapter=await navigator.gpu?.requestAdapter(softwareAdapter?{forceFallbackAdapter:true}:undefined);
    if(!adapter)return {skipped:'No WebGPU adapter'};
    const info=adapter.info??{};
    software=softwareAdapter||adapter.isFallbackAdapter||/swiftshader|llvmpipe|software/i.test([info.vendor,info.architecture,info.device,info.description].join(' '));
    device=await adapter.requestDevice();
    device.addEventListener('uncapturederror',e=>errors.push(String(e.error?.message??e.error)));
    device.lost.then(info=>lost=info.message||info.reason);
    renderer=new WebGPURenderer({canvas,device,antialias:false,alpha:false});
    renderer.onDeviceLost=info=>{lost=info?.message||info?.reason||'GPU device lost';};
    await renderer.init();
    if(!renderer.backend?.isWebGPUBackend)throw Error('Not a WebGPU backend');
    apply=setWebGpuWeathering;
  }else{
    renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,preserveDrawingBuffer:true});
    apply=setWebGlWeathering;
  }
  renderer.setSize(480,320,false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.NoToneMapping;
  scene=new THREE.Scene();scene.background=new THREE.Color(0x182332);
  camera=new THREE.PerspectiveCamera(45,1.5,.1,160);
  camera.position.set(12,9,20);camera.lookAt(0,1,0);
  scene.add(new THREE.HemisphereLight(0xffffff,0xc4b9a9,2.1));
  const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-5,10,5);scene.add(sun);
  const color=0x888888;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color,roughness:1}));
  floor.rotation.x=-Math.PI/2;scene.add(floor);
  const wall=new THREE.Mesh(new THREE.BoxGeometry(15,5,2),api==='webgpu'?new MeshStandardNodeMaterial({color,roughness:1}):new THREE.MeshStandardMaterial({color,roughness:1}));
  wall.position.set(0,2.5,-3);scene.add(wall);
  materials=[floor.material,wall.material];
  mask=makeWeatherMask();
  return {api,ok:true,software};
};
async function renderChecked(draw){
  let scoped=false;
  try{
    if(device){device.pushErrorScope('validation');scoped=true;}
    await draw();
    await tick();await tick();
  }catch(error){
    if(software&&instanceDropped(error))lost=String(error);else throw error;
  }finally{
    if(scoped){
      try{
        const validation=await device.popErrorScope();
        if(validation)errors.push(validation.message);
      }catch(error){
        // Dawn/SwiftShader may drop the instance even on the unmodified
        // baseline frame. This is not a shader validation result.
        if(software&&instanceDropped(error))lost=String(error);else throw error;
      }
    }
  }
  return {errors:[...errors],lost:lost??null};
};
window.drawWeatherSmoke=async quality=>{
  const params=weatherParameters('quarry','concrete',quality);
  for(const material of materials)apply(material,params?mask:null,params);
  return renderChecked(async()=>{await renderer.compileAsync(scene,camera);renderer.render(scene,camera);});
};
window.drawWaterSmoke=async quality=>{
  const map=getMap('fy_pool_day');
  if(!waterScene){
    waterScene=new THREE.Scene();waterScene.background=new THREE.Color(0x314d65);waterScene.fog=new THREE.FogExp2(0x314d65,.002);
    waterRoot=new THREE.Group();waterScene.add(waterRoot);
    waterCamera=new THREE.PerspectiveCamera(48,1.5,.1,160);
    waterCamera.position.set(7,3,15);waterCamera.lookAt(0,-.25,8.45);
    waterScene.add(new THREE.HemisphereLight(0xffffff,0x877e64,2.4));
    waterSun=new THREE.DirectionalLight(0xffffff,2.4);waterSun.position.set(-6,10,4);waterScene.add(waterSun);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshStandardMaterial({color:0x9cb4ac,roughness:.82}));
    floor.position.set(0,-1.28,8.45);floor.rotation.x=-Math.PI/2;waterRoot.add(floor);
    for(let i=0;i<6;i++){
      const tile=new THREE.Mesh(new THREE.BoxGeometry(1.5,.04,9),new THREE.MeshStandardMaterial({color:i%2?0xc2a36d:0x31535d}));
      tile.position.set(i*1.65-4.1,-1.24,8.45);waterRoot.add(tile);
    }
    const wall=new THREE.Mesh(new THREE.BoxGeometry(11,5,1),new THREE.MeshStandardMaterial({color:0xb08a62,roughness:.64}));
    wall.position.set(0,2,1.4);waterRoot.add(wall);
    const pool=map.pools.find(p=>p.z>0);
    const water=new THREE.Mesh(new THREE.PlaneGeometry(pool.w,pool.d),new THREE.MeshStandardMaterial({color:0x41858c,transparent:true,depthWrite:false,opacity:.46}));
    water.rotation.x=-Math.PI/2;water.position.set(pool.x,pool.waterY,pool.z);water.userData.waterSurface=true;water.renderOrder=1;waterRoot.add(water);
    waterRoot.updateMatrixWorld(true);
    waterAppearance=new WaterAppearance();
    waterPost=device?new WebGpuPostPass(renderer,{antialias:'off'}):new PostPass(renderer,{antialias:'off'});
  }
  const active=quality==='high',settings={...graphicsEffects('high'),water:quality,waterFoam:active?'high':'off',waterRefraction:active?'high':'off',reflections:active?'high':'off',vignette:'off',grain:'off'};
  waterAppearance.update(1,waterRoot,map,quality,settings.waterRefraction,settings.waterFoam,null);
  waterPost.worldEffects.receivers.invalidate();
  waterPost.worldEffects.receiverMode=waterPost.worldEffects.receivers.update(map.id,waterRoot,waterCamera,active);
  waterPost.setImage(settings,gradeParameters(settings,map));
  const result=await renderChecked(async()=>{
    waterPost.begin('high');
    renderer.render(waterScene,waterCamera);
    if(waterPost.worldEffects.world)waterPost.worldEffects.apply(waterPost.target,waterCamera,waterScene,waterSun.position,waterSun,false,1,null,null);
    waterPost.end(1,'high',null);
  });
  return {...result,receivers:waterPost.worldEffects.receivers.count,transmission:waterAppearance.material?.transmission??0};
};
window.drawEffectSmoke=async mode=>{
  if(!fxScene){
    fxScene=new THREE.Scene();fxScene.background=new THREE.Color(0x18212b);
    fxCamera=new THREE.PerspectiveCamera(46,1.5,.1,100);
    fxCamera.position.set(0,1.6,6);fxCamera.lookAt(0,1.4,0);
    fxScene.add(new THREE.HemisphereLight(0x99b0c8,0x646060,.32));
    const wall=new THREE.Mesh(new THREE.PlaneGeometry(8,5),new THREE.MeshStandardMaterial({color:0x969696,roughness:.82}));
    wall.position.set(0,1.6,0);fxScene.add(wall);
    const cube=new THREE.Mesh(new THREE.BoxGeometry(.8,.8,.8),new THREE.MeshLambertMaterial({color:0x888888}));
    cube.position.set(1.2,.45,.65);fxScene.add(cube);
    fxLights=new EffectLights(fxScene);fxParticles=new THREE.Group();fxScene.add(fxParticles);
    const smokeTexture=makeParticleTexture('smoke'),fireTexture=makeParticleTexture('fire'),muzzleTexture=makeParticleTexture('muzzle');
    const geometry=new THREE.PlaneGeometry(1,1);
    geometry.setAttribute('instanceAlpha',new THREE.InstancedBufferAttribute(new Float32Array([.85,.65]),1));
    geometry.setAttribute('instanceRotation',new THREE.InstancedBufferAttribute(new Float32Array([0,.4]),1));
    const material=device?createWebGpuSmokeMaterial(smokeTexture):new THREE.MeshBasicMaterial({map:smokeTexture,transparent:true,depthWrite:false});
    if(device){material.userData.smokeUniforms.smokeMotion.value=2;material.userData.smokeUniforms.smokeTime.value=1;}
    const batch=new THREE.InstancedMesh(geometry,material,2),dummy=new THREE.Object3D();
    for(let i=0;i<2;i++){dummy.position.set(-1+i*.75,1.2+i*.45,.6);dummy.scale.setScalar(1.5);dummy.updateMatrix();batch.setMatrixAt(i,dummy.matrix);batch.setColorAt(i,new THREE.Color(0xb6a69a));}
    batch.instanceMatrix.needsUpdate=true;batch.instanceColor.needsUpdate=true;fxParticles.add(batch);
    for(const [i,map] of [fireTexture,muzzleTexture].entries()){
      const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false,color:new THREE.Color(2,1.65,1.2)}));
      sprite.position.set(.2+i*.8,.9+i*.65,1);sprite.scale.setScalar(.9);fxParticles.add(sprite);
    }
    if(device){
      const flame=webGpuCampaignFlame(1);flame.userData.fireUniforms.detail.value=1;flame.userData.fireUniforms.time.value=1;
      const mesh=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.3),flame);mesh.position.set(1.8,1.15,.8);fxParticles.add(mesh);
    }
  }
  fxParticles.visible=mode==='particles';
  if(mode==='off'||mode==='offAgain')fxLights.configure('off','off');
  else fxLights.configure('high','off');
  if(mode==='flash'){fxLights.pulse(new THREE.Vector3(-.8,1.5,1.15),1,{own:true,energy:38,range:7});fxLights.update(1,fxCamera.position);}
  else fxLights.update(1.2,fxCamera.position);
  const result=await renderChecked(async()=>{await renderer.compileAsync(fxScene,fxCamera);renderer.render(fxScene,fxCamera);});
  return {...result,lights:fxLights.active,slots:fxLights.lights.length};
};
let airScene,airCamera,airSky,airPost,airSun;
window.drawAtmosphereSmoke=async mode=>{
  if(!airScene){
    airScene=new THREE.Scene();airScene.background=new THREE.Color(0x97a5ae);airScene.fog=new THREE.FogExp2(0x97a5ae,.001);
    airCamera=new THREE.PerspectiveCamera(60,1.5,.1,950);airCamera.position.set(0,2,0);airCamera.lookAt(0,10,-60);
    airSun=new THREE.DirectionalLight(0xffdfb4,2.7);airSun.position.set(-28,35,-65);airScene.add(airSun);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshBasicMaterial({color:0x353f3b}));
    floor.rotation.x=-Math.PI/2;airScene.add(floor);
    for(let i=0;i<3;i++){
      const block=new THREE.Mesh(new THREE.BoxGeometry(11,6+i*5,8),new THREE.MeshBasicMaterial({color:0x232d36}));
      block.position.set((i-1)*17,3+i*2.5,-38-i*38);airScene.add(block);
    }
    airSky=device?makeWebGpuSky(airScene,renderer):makeSky(airScene,renderer);
    airSky.sky.position.copy(airCamera.position);
    airPost=device?new WebGpuPostPass(renderer,{antialias:'off'}):new PostPass(renderer,{antialias:'off'});
  }
  const map=getMap('quarry'),clouds=mode==='cloud'||mode==='moving'?'high':'off';
  const settings={...graphicsEffects('high'),sky:'high',clouds,heightFog:mode==='fog'?'high':'off',
    atmosphere:mode==='rays'?'high':'off',vignette:'off',grain:'off'};
  airSky.update('high',airSun.position,mode==='moving'?25:0,clouds,map,airScene.fog.color);
  airPost.worldEffects.airClimate=atmosphereProfile(map);airPost.worldEffects.atmosphereAllowed=true;
  airPost.setImage(settings,gradeParameters(settings,map));
  const result=await renderChecked(async()=>{
    airPost.begin('high');renderer.render(airScene,airCamera);
    if(airPost.worldEffects.world)airPost.worldEffects.apply(airPost.target,airCamera,airScene,airSun.position,airSun,false,1,null,null);
    airPost.end(1,'high',null);
  });
  return {...result,fog:airPost.worldEffects.heightFog,mask:Boolean(airPost.worldEffects.mask),passes:airPost.worldEffects.passes};
};
let giScene,giCamera,giMaterials,giField;
window.drawGISmoke=async quality=>{
  if(!giScene){
    giScene=new THREE.Scene();giScene.background=new THREE.Color(0x24313d);
    giCamera=new THREE.PerspectiveCamera(46,1.5,.1,80);
    giCamera.position.set(0,2,10);giCamera.lookAt(0,1.65,0);
    giScene.add(new THREE.HemisphereLight(0xe1e9f0,0xaaa095,.68));
    const geometry=new THREE.BoxGeometry(5,3,.5);
    const left=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xbababa,roughness:.95}));
    const right=new THREE.Mesh(geometry,new THREE.MeshLambertMaterial({color:0xbababa}));
    left.position.set(-2.6,1.5,0);right.position.set(2.6,1.5,0);giScene.add(left,right);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,18),new THREE.MeshStandardMaterial({color:0x939393,roughness:1}));floor.rotation.x=-Math.PI/2;giScene.add(floor);
    const block=new THREE.Mesh(new THREE.BoxGeometry(.8,1,.8),new THREE.MeshStandardMaterial({color:0x999999}));block.position.set(-2,.5,2);giScene.add(block);
    const map={id:'gi-fixture',size:24,terrain:{heightAt:()=>0},boxes:[
      {x:-3,z:1,w:9,d:10,baseY:3.5,h:.4,color:'#c95b39',kind:'roof'},
      {x:-6.8,z:1,w:.4,d:10,baseY:0,h:3.5,color:'#d76c38',kind:'wall'},
      {x:-2.6,z:0,w:5,d:.5,baseY:0,h:3,color:'#b5a9a0',kind:'wall'},
      {x:2.6,z:0,w:5,d:.5,baseY:0,h:3,color:'#929ca4',kind:'wall'},
    ]};
    const baked=bakeProbeField(map,{spacing:.75,maxCells:32});
    giField=probeUniforms(baked,makeProbeTexture(baked));giMaterials=[left.material,right.material,floor.material,block.material];
  }
  const applyGI=device?setWebGpuGI:setWebGlGI;
  for(const material of giMaterials)applyGI(material,null);
  giField.strength.value=quality==='off'?0:1;giField.quality.value=quality==='high'?2:1;
  if(giField.gpu)giField.gpu.strength.value=giField.strength.value;
  if(quality!=='off')for(const material of giMaterials)applyGI(material,giField);
  const result=await renderChecked(async()=>{await renderer.compileAsync(giScene,giCamera);renderer.render(giScene,giCamera);});
  return {...result,materials:giMaterials.length};
};
</script></body></html>
