<!doctype html><html lang="ru"><meta charset="utf-8"><base href="/"><title>SECTOR 09 · Карьер и танк</title><style>body{margin:0;background:#111;color:#d9e5c7;font:13px Arial}canvas{width:100vw;height:100vh;display:block}aside.review{position:fixed;top:15px;left:15px;padding:14px;background:#101c18ed;border:1px solid #8b9b6a;border-radius:5px;z-index:50;width:185px}label{display:block;margin-top:10px}select{display:block;background:#27362a;color:#e3eccf;padding:6px;width:100%;border:1px solid #84906a}output{display:block;margin-top:10px;white-space:pre-wrap;font:11px monospace}#hud{position:fixed;inset:0;pointer-events:none}</style>
<canvas id="view"></canvas><section id="hud"></section><aside class="review"><b>КАРЬЕР / ТАНК · 0.16</b><label>Ракурс<select id="pose"><option value="driver">Водитель · 3 лицо</option><option value="first">Водитель · люк</option><option value="gunner">Стрелок · орудие</option><option value="mg">Стрелок · пулемёт</option><option value="reload">Перезарядка</option><option value="track">Повреждение гусеницы</option><option value="exterior">Танк снаружи</option><option value="bunker">ДОТ снаружи</option><option value="inside">ДОТ внутри</option><option value="point-A">Подход к A</option><option value="point-B">Подход к B</option><option value="point-C">Подход к C</option><option value="point-D">Подход к D</option><option value="point-E">Подход к E</option></select></label><label>Поворот<select id="angle"><option value="0">Сзади</option><option value="1.57">Справа</option><option value="3.14">Спереди</option><option value="4.71">Слева</option></select></label><label>Качество<select id="quality"><option>high</option><option>low</option></select></label><label>Зум<select id="zoom"><option value="0">Обычный</option><option value="1">3×</option></select></label><output id="info">Загрузка…</output></aside>
<script type="module">
import{GameRenderer}from'../src/renderer.js';import{Simulation}from'../shared/simulation.js';import{loadFPSHands}from'../src/fps-hands.js';import{getVehicleSeatPose,vehicleBodyTilt}from'../shared/vehicles.js';import{warmTankAssets}from'../src/vehicles.js';import{TankHud}from'../src/tank-hud.js';
await loadFPSHands();const r=new GameRenderer(document.querySelector('canvas')),sim=new Simulation({mapId:'quarry',bots:0}),p=sim.addPlayer('preview','Ворон',0),v=sim.vehicles.find(v=>v.type==='tank'&&v.team===0),hud=new TankHud(document.querySelector('#hud'));r.setMap('quarry');await r.surfaces.ready;await r.tankWarmup;Object.assign(v,{x:-24,z:-165,y:sim.groundAt(-24,-165),yaw:0,aimYaw:0,aimPitch:0});const passengers=['Гранит','Кедр','Дозор'].map((name,i)=>sim.addPlayer('passenger'+i,name,0));const b=sim.map.structures.find(s=>s.kind==='pillbox'),by=sim.groundAt(b.x,b.z);let last=performance.now(),time=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;sim.time=time;
 const pose=document.querySelector('#pose').value,angle=Number(document.querySelector('#angle').value),zoom=document.querySelector('#zoom').value==='1',bunker=pose==='bunker'||pose==='inside',exterior=pose==='exterior',point=sim.points.find(point=>pose==='point-'+point.id),gunner=['gunner','mg','reload','track'].includes(pose);
 p.vehicleId=bunker||exterior||point?null:v.id;p.vehicleSeat=gunner?1:0;v.seats.fill(null);for(const [i,crew]of passengers.entries()){v.seats[i+2]=crew.id;crew.vehicleId=v.id;crew.vehicleSeat=i+2;}if(p.vehicleId)v.seats[p.vehicleSeat]=p.id;v.weapon=pose==='mg'?1:0;v.cannonReadyAt=pose==='reload'?time+2.3:0;v.leftTrack=pose==='track'?88:0;v.rightTrack=0;v.hp=pose==='track'?550:2400;v.burning=pose==='track';v.speed=0;
 Object.assign(v,vehicleBodyTilt(v,sim.map.terrain));if(p.vehicleId){const seat=getVehicleSeatPose(v,p.vehicleSeat);Object.assign(p,{x:seat.x,y:seat.y-1.65,z:seat.z});}else Object.assign(p,{x:point?point.x-16:bunker?b.x:v.x+8,y:point?sim.groundAt(point.x,point.z)+4.35:bunker?by:v.y,z:point?point.z+40:bunker?b.z:v.z+8});
 for(const crew of passengers){const seat=getVehicleSeatPose(v,crew.vehicleSeat);Object.assign(crew,{x:seat.x,y:seat.y-1.65,z:seat.z});}const state=sim.snapshot();r.render(state,p.id,dt,{yaw:gunner?0:angle-.45,pitch:gunner?0:-.12,vehicleCameraYaw:angle-.45,vehicleThirdPerson:pose!=='first',quality:document.querySelector('#quality').value,fov:85,aim:zoom,shake:false,gfx:{shadows:'auto',resolution:'1'}});
 if(exterior||bunker||point){r.weapon.visible=false;if(point){r.camera.position.set(point.x-16,sim.groundAt(point.x,point.z)+6,point.z+40);r.camera.lookAt(point.x,sim.groundAt(point.x,point.z)+1,point.z);}else if(exterior){r.camera.fov=60;r.camera.updateProjectionMatrix();r.camera.position.set(v.x+Math.sin(angle+.6)*10,v.y+4.3,v.z+Math.cos(angle+.6)*10);r.camera.lookAt(v.x,v.y+1.5,v.z);}else if(pose==='inside'){r.camera.position.set(b.x,by+1.6,b.z+.7);r.camera.lookAt(b.x,by+1.6,b.z-6);}else{r.camera.position.set(b.x+7,by+4,b.z+9);r.camera.lookAt(b.x,by+1,b.z);}r.drawScene();}
 hud.update(state,p,r,now,{zoom,thirdPerson:pose!=='first'});const stats=r.getStats();document.querySelector('#info').textContent=`${pose} · ${stats.calls} draws\n${stats.triangles} triangles\n${Math.round(v.hp)} HP · ${v.cannonAmmo} ОФ`;
}requestAnimationFrame(frame);
</script></html>
