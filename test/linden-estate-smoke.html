<!DOCTYPE html>
<html><head><meta charset="utf-8"/><base href="/"/><title>Linden Estate GLB integration smoke</title></head><body style="margin:0;background:#17201a">
<canvas id="scene" width="640" height="400"></canvas>
<script type="module">
import * as THREE from 'three';
import { getMap } from '../shared/world.js';
import { GameRenderer } from '../src/renderer.js';
import { loadFPSHands } from '../src/fps-hands.js';

window.runLindenSmoke=async()=>{
 const map=getMap('linden_estate');
 const canvas=document.querySelector('#scene');
 await loadFPSHands();
 const game=new GameRenderer(canvas,{antialias:'off'});
 await Promise.all([game.surfaces.ready,game.preloadMapVisuals(map.id)]);
 game.setMap(map.id);
 const world=game.worlds.get(map.id);
 game.updateBakedDetail(world,true);
 await world.model.detailLoad;
 const estate=world.root;
 if(world.model.base?.parent!==estate||world.model.detail?.parent!==estate)
   throw new Error('Linden Estate layers did not load');
 const meshes=[],materials=new Set();
 estate.traverse(o=>{if(o.isMesh){meshes.push(o);(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));}});
 if(meshes.length<42)throw new Error('GLB meshes missing: '+meshes.length);
 const bounds=new THREE.Box3().setFromObject(estate);
 const size=bounds.getSize(new THREE.Vector3());
 if(size.x<55||size.z<49||size.y<8)throw new Error('GLB bounds incorrect '+size.toArray().join(','));
 game.camera.position.fromArray(map.menuView.eye);
 game.camera.fov=map.menuView.fov;
 game.camera.lookAt(...map.menuView.target);
 game.camera.updateProjectionMatrix();
 game.weapon.visible=false;
 game.atmosphere.sky.position.copy(game.camera.position);
 game.drawScene(true);
 return {ok:true,meshes:meshes.length,materials:materials.size,
   width:+size.x.toFixed(2),height:+size.y.toFixed(2),depth:+size.z.toFixed(2),
   objectName:estate.name};
};
</script></body></html>
