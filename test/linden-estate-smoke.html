<!DOCTYPE html>
<html><head><meta charset="utf-8"/><base href="/"/><title>Linden Estate GLB integration smoke</title></head><body style="margin:0;background:#17201a">
<canvas id="scene" width="640" height="400"></canvas>
<script type="module">
import * as THREE from 'three';
import { getMap } from '../shared/world.js';
import { buildMapScene } from '../src/map-scene.js';

window.runLindenSmoke=async()=>{
 const map=getMap('linden_estate');
 const canvas=document.querySelector('#scene');
 const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
 renderer.setSize(640,400,false);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9fc8e0);
 const owner={scene,map};
 const level=buildMapScene(owner,map);
 let estate;
 for(let count=0;count<140;count++){
   estate=level.root.getObjectByName('Linden Estate · imported GLB');
   if(estate)break;
   await new Promise(resolve=>setTimeout(resolve,50));
 }
 if(!estate)throw new Error('Linden Estate GLB did not load (timeout)');
 const meshes=[],materials=new Set();
 estate.traverse(o=>{if(o.isMesh){meshes.push(o);(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));}});
 if(meshes.length<42)throw new Error('GLB meshes missing: '+meshes.length);
 const bounds=new THREE.Box3().setFromObject(estate);
 const size=bounds.getSize(new THREE.Vector3());
 if(size.x<45||size.z<44||size.y<10)throw new Error('GLB bounds incorrect '+size.toArray().join(','));
 const camera=new THREE.PerspectiveCamera(60,640/400,.1,200);
 camera.position.set(37,31,46);camera.lookAt(0,3,6);
 scene.add(new THREE.HemisphereLight(0xd9f1ff,0x7d633f,2));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-20,34,19);scene.add(light);
 renderer.render(scene,camera);
 return {ok:true,meshes:meshes.length,materials:materials.size,
   width:+size.x.toFixed(2),height:+size.y.toFixed(2),depth:+size.z.toFixed(2),
   objectName:estate.name};
};
</script></body></html>
