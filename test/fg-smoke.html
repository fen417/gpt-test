<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><title>FG WebGPU smoke</title></head>
<body><script type="module">
import * as THREE from 'three';
import { WebGPURenderer, MeshBasicNodeMaterial } from 'three/webgpu';
import { vec4 } from 'three/tsl';
import { WebGpuPostPass } from '../src/webgpu-post-pass.js';
import { WebGpuFrameGeneration } from '../src/webgpu-frame-generation.js';

window.runFrameGenerationSmoke=async()=>{
  if(!navigator.gpu)return {skipped:'navigator.gpu unavailable'};
  const adapter=await navigator.gpu.requestAdapter();
  if(!adapter)return {skipped:'No WebGPU adapter'};
  const device=await adapter.requestDevice();
  // Validation errors are collected from the WebGPU console in the runner.
  const canvas=document.createElement('canvas');
  canvas.style.width='256px';canvas.style.height='144px';document.body.append(canvas);
  const renderer=new WebGPURenderer({canvas,device,alpha:false,stencil:false,antialias:false});
  let post=null,fg=null;
  try{
    await renderer.init();renderer.setSize(256,144,false);
    post=new WebGpuPostPass(renderer,{antialias:'off'});
    fg=new WebGpuFrameGeneration(renderer,post);post.frameGeneration=fg;
    fg.setMode('1.5');
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x888899);
    const camera=new THREE.PerspectiveCamera(65,256/144,.1,100);
    camera.position.set(0,0,4);
    const standard=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xd0b37c}));
    scene.add(standard);
    const physical=new THREE.Mesh(new THREE.SphereGeometry(.4,12,8),new THREE.MeshPhysicalMaterial({color:0x55cc99}));
    physical.position.x=-.75;scene.add(physical);
    const basic=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),new THREE.MeshBasicMaterial({color:0x577fff}));
    basic.position.x=.72;scene.add(basic);
    // Reproduces the menu sky: r181 fragmentNode bypasses automatic MRT setup.
    const custom=new MeshBasicNodeMaterial({depthWrite:false});
    const originalFragment=vec4(.2,.3,.4,1);
    custom.fragmentNode=originalFragment;
    const sky=new THREE.Mesh(new THREE.SphereGeometry(20,16,8),custom);
    sky.material.side=THREE.BackSide;scene.add(sky);
    const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(1,2,3);scene.add(light);
    const meta={playerId:'ci',mapId:'ci',alive:true,weaponId:'ci',vehicleId:null,seat:null,
      scoped:false,aim:false,thirdPerson:false,yaw:0,pitch:0,x:0,y:0,z:0};
    for(const [index,upscale] of ['off','quality','quality'].entries()){
      standard.rotation.y+=.04;
      post.setUpscaling(upscale,1,40);
      post.begin('low');
      try{
        fg.beginWorld(scene);
        if(fg.target.textures[0].name!=='output'||fg.target.textures[1].name!=='velocity')
          throw new Error('MRT targets do not match the r181 output/velocity fragment keys');
        if(!custom.fragmentNode.isMRTNode)throw new Error('Custom material did not receive MRT fragment output');
        renderer.render(scene,camera);
      }finally{fg.endWorld();}
      post.end(index/60,'low');
      fg.noteReal(16+index*16,meta,4);
    }
    if(!fg.generate(80))throw new Error('History was ready but generated frame not presented');
    if(!fg.enabled||fg.target.textures.length!==2)throw new Error('MRT velocity was not attached');
    const generated=fg.policy.summary().generatedFrames;
    fg.setMode('off');
    if(custom.fragmentNode!==originalFragment)throw new Error('Custom fragment shader not restored when FG is off');
    fg.setMode('1.5');

    return {ok:true,generated,mode:fg.policy.mode,
      mrt:fg.target.textures.length,depth:!!fg.target.depthTexture,renderScale:post.fsrScale,
      customFragmentRestored:true,
      backend:renderer.backend.constructor.name};
  } finally {
    fg?.dispose();post?.dispose();renderer.dispose();device.destroy();canvas.remove();
  }
};
</script></body></html>
