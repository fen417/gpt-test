<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>WebGPU single target FG smoke</title></head>
<body><script type="module">
import * as THREE from 'three';
import { WebGPURenderer, MeshBasicNodeMaterial } from 'three/webgpu';
import { vec4 } from 'three/tsl';
import { WebGpuPostPass } from '../src/webgpu-post-pass.js';
import { WebGpuFrameGeneration } from '../src/webgpu-frame-generation.js';

window.runFrameGenerationSmoke=async()=>{
  if(!navigator.gpu)return {skipped:'navigator.gpu unavailable'};
  const adapter=await navigator.gpu.requestAdapter();
  if(!adapter)return {skipped:'No WebGPU adapter'};
  const device=await adapter.requestDevice();
  const canvas=document.createElement('canvas');document.body.append(canvas);
  canvas.style.width='256px';canvas.style.height='144px';
  const renderer=new WebGPURenderer({canvas,device,antialias:false,stencil:false,alpha:false});
  let post=null,fg=null;
  try {
    await renderer.init();renderer.setSize(256,144,false);
    post=new WebGpuPostPass(renderer,{antialias:'off'});
    fg=new WebGpuFrameGeneration(renderer,post);post.frameGeneration=fg;
    fg.setMode('1.5');
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x888899);
    const camera=new THREE.PerspectiveCamera(65,256/144,.1,100);
    camera.position.set(0,0,4);

    const standard=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),
      new THREE.MeshStandardMaterial({color:0xd0b37c}));
    scene.add(standard);
    const physical=new THREE.Mesh(new THREE.SphereGeometry(.35,12,8),
      new THREE.MeshPhysicalMaterial({color:0x55cc99}));
    physical.position.x=-1;scene.add(physical);
    const basic=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),
      new THREE.MeshBasicMaterial({color:0x577fff}));
    basic.position.x=1;scene.add(basic);
    const lambert=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),
      new THREE.MeshLambertMaterial({color:0xa0a0a0}));
    lambert.position.y=.9;scene.add(lambert);
    const custom=new MeshBasicNodeMaterial({depthWrite:false});
    const originalFragment=vec4(.2,.3,.4,1);
    custom.fragmentNode=originalFragment;custom.side=THREE.BackSide;
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(20,16,8),custom));
    const light=new THREE.DirectionalLight(0xffffff,2);
    light.position.set(1,2,3);
    scene.add(light);

    // Skinned/instanced objects previously triggered VelocityNode.update and
    // GPUQueue.writeBuffer exceptions in the full game.
    const geometry=new THREE.BoxGeometry(.2,.4,.2);
    const count=geometry.getAttribute('position').count;
    const indices=new Uint16Array(count*4);
    const weights=new Float32Array(count*4);
    for(let i=0;i<count;i++)weights[i*4]=1;
    geometry.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(indices,4));
    geometry.setAttribute('skinWeight',new THREE.Float32BufferAttribute(weights,4));
    const soldier=new THREE.SkinnedMesh(geometry,new THREE.MeshStandardMaterial({color:0xffccaa}));
    const bone=new THREE.Bone();soldier.add(bone);
    soldier.bind(new THREE.Skeleton([bone]));
    soldier.position.x=.5;scene.add(soldier);
    const instanced=new THREE.InstancedMesh(new THREE.BoxGeometry(.1,.1,.1),
      new THREE.MeshStandardMaterial({color:0xabaeb9}),2);
    const temp=new THREE.Matrix4();
    for(let i=0;i<2;i++)instanced.setMatrixAt(i,temp.makeTranslation((i-.5)*.8,-.6,0));
    instanced.instanceMatrix.needsUpdate=true;scene.add(instanced);

    const meta={playerId:'ci',mapId:'ci',alive:true,weaponId:'ci',
      vehicleId:null,seat:null,scoped:false,aim:false,thirdPerson:false,
      yaw:0,pitch:0,fov:85,x:0,y:0,z:0};
    for(const [index,upscale] of ['off','quality','quality','quality'].entries()){
      standard.rotation.y+=.04;bone.rotation.z+=.03;
      post.setUpscaling(upscale,1,40);
      post.begin('low');
      // No multi-target pipelines can be created by FG.
      if(renderer.getMRT()!==null)throw new Error('FG unexpectedly enabled global MRT');
      if(post.target.textures.length!==1)throw new Error('World render target is not single attachment');
      if(custom.fragmentNode!==originalFragment)throw new Error('FG modified the sky shader');
      renderer.render(scene,camera);
      post.end(index/60,'low');
      fg.noteReal(16+index*16,meta,4);
    }
    if(!fg.generate(100,meta))throw new Error('Ready FG did not generate');
    const generated=fg.policy.summary().generatedFrames;
    fg.setMode('off');
    if(renderer.getMRT()!==null||custom.fragmentNode!==originalFragment)
      throw new Error('FG altered materials or MRT after being disabled');
    fg.setMode('1.5');
    return {ok:true,generated,mode:fg.policy.mode,
      mrt:post.target.textures.length,renderScale:post.fsrScale,
      customFragmentPreserved:true,backend:renderer.backend.constructor.name};
  } finally {
    fg?.dispose();post?.dispose();renderer.dispose();device.destroy();canvas.remove();
  }
};
</script></body></html>
