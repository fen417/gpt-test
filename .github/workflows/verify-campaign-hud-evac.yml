name: Verify campaign marker, extraction and radio mix
on:
  push:
    branches:
      - fix/campaign-markers-evac-music-mix
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Campaign HUD, evacuation and music regressions
        run: node --test test/campaign-marker-evac-music.test.js
      - name: Full test suite
        run: npm test
      - name: Web production build
        run: npm run build
