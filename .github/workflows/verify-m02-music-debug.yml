name: Verify mission 2 music loop and campaign unlock
on:
  push:
    branches:
      - fix/m02-music-loop-and-hidden-campaign
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test updated music loop and debug menu unlock
        run: node --test test/campaign-m02-music-access.test.js
      - name: Full game regressions
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/m02-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/m02-web.log
          exit 1
      - name: Verify hidden campaign and mission 2 in Chromium
        run: node scripts/verify-campaign-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-debug-gate-and-mission2-screens
          path: artifacts/campaign-map/
          if-no-files-found: ignore
