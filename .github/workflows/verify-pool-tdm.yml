name: Verify Pool Day TDM branch
on:
  push:
    branches: [test, feature/linden-estate-tdm-023]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pool-tdm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Targeted authoritative TDM tests
        run: node --test test/pool-tdm.test.js
      - name: Linden Estate GLB and class-based TDM tests
        run: node --test test/linden-estate.test.js
      - name: Graphics API and tank atlas regression tests
        run: node --test test/graphics-api.test.js
      - name: Frame generation scheduling tests
        run: node --test test/frame-generation.test.js
      - name: WebGPU KTX2 RGBA fallback tests
        run: node --test test/webgpu-ktx2.test.js
      - name: Build browser game
        run: npm run build
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Start local browser game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pool-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pool-vite.log
          exit 1
      - name: Verify color parity and real GLB texture upload
        run: node scripts/verify-color-pipeline.mjs
      - name: Browser smoke test and overview
        run: node scripts/verify-pool-day.mjs
      - name: Browser graphics API + FSR smoke
        run: node scripts/verify-graphics-apis.mjs
      - name: Browser WebGPU FG shader smoke
        run: node scripts/verify-frame-generation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-day-tdm-review-screenshots
          path: artifacts/pool-day/
          if-no-files-found: ignore
