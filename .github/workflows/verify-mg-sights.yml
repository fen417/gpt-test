name: Verify MG sight fixes
on:
  push:
    branches:
      - fix/mg36-pkp-ads-sights-018
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test MG and PKP sight picture
        run: node --test test/support-iron-sights.test.js
      - name: Full regression tests
        run: npm test
      - name: Build web client
        run: npm run build
