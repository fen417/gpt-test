name: World editor validation
on:
  push:
    branches: ['editor/world-editor']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --check tools/world-editor/editor.js && node --check scripts/world-editor-server.mjs
      - run: node --test test/m05-editor.test.js test/mission5.test.js test/world-editor-assets.test.js
      - run: npm run build
        env:
          S09_PBR_SKIP: '1'
      - run: test ! -f dist/world-editor.html

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/world-editor-smoke.mjs
        env:
          S09_PBR_SKIP: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: world-editor-browser-failure
          path: .perf-local/world-editor-failure.png
