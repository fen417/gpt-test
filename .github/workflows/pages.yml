name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test on Node 24
        run: npm test
      - name: Restore previous benchmark
        uses: actions/cache@v4
        with:
          path: .perf-ci/baseline.json
          key: perf-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ github.sha }}
          restore-keys: |
            perf-v1-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Benchmark simulation and flag regressions
        run: npm run bench -- --ci --baseline .perf-ci/baseline.json --output .perf-ci/current.json
      - name: Keep benchmark for next comparison
        run: node -e "require('node:fs').copyFileSync('.perf-ci/current.json','.perf-ci/baseline.json')"
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-performance
          path: .perf-ci/current.json
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.SECTOR_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
