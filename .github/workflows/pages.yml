name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_test:
        description: 'Also publish the independent offline test branch (larger artifact)'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: CPU rendering regression tests
        run: node --test test/optimization-regression.test.js test/three-r187-cache.test.js
      - name: WebGL sampler browser regression
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5174 --strictPort >/tmp/s09-vite.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5174/test/three-r187-samplers.html >/dev/null && break; sleep 1; done
          browser=$(command -v google-chrome || command -v chromium)
          timeout 90 "$browser" --headless --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=30000 --dump-dom http://127.0.0.1:5174/test/three-r187-samplers.html >/tmp/s09-sampler.html
          cat /tmp/s09-sampler.html
          grep -Fq '<pre id="result">S09_SAMPLER_SMOKE_PASS</pre>' /tmp/s09-sampler.html
      - name: Restore previous benchmark
        uses: actions/cache@v4
        with:
          path: .perf-ci/baseline.json
          key: perf-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ github.sha }}
          restore-keys: |
            perf-v1-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Benchmark simulation and flag regressions
        run: npm run bench -- --ci --baseline .perf-ci/baseline.json --output .perf-ci/current.json
      - name: Keep benchmark for next comparison
        run: node -e "require('node:fs').copyFileSync('.perf-ci/current.json','.perf-ci/baseline.json')"
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-performance
          path: .perf-ci/current.json
      - run: npm run build
        env:
          VITE_TEST_BUILD: '0'
          S09_PBR_SKIP: '1'
          VITE_SERVER_URL: ${{ vars.SECTOR_SERVER_URL }}
          VITE_FIREBASE_CONFIG: ${{ vars.SECTOR_FIREBASE_WEB_CONFIG }}
      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-performance
          path: |
            .perf-local/build-budget.json
            .perf-local/bundle.html
      - name: Checkout experimental branch
        if: github.event_name == 'workflow_dispatch' && inputs.include_test
        uses: actions/checkout@v4
        with:
          ref: remaster/pbr-ktx2
          path: preview-source
          persist-credentials: false
      - name: Install experimental dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.include_test
        working-directory: preview-source
        run: npm ci
      - name: Build offline experimental game
        if: github.event_name == 'workflow_dispatch' && inputs.include_test
        working-directory: preview-source
        run: npm run build
        env:
          S09_PBR_SKIP: '1'
          VITE_TEST_BUILD: '1'
          VITE_SERVER_URL: ''
          VITE_FIREBASE_CONFIG: 'null'
      - name: Assemble and validate Pages site
        shell: bash
        env:
          INCLUDE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.include_test }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/pbr-v1/manifest.json
          test -f dist/gi-v1/manifest.json
          test -f dist/architecture-v1/manifest.json
          test -f dist/basis/basis_transcoder.wasm
          test ! -e dist/test
          printf '%s\n' "$(git rev-parse HEAD)" > dist/build-revision.txt
          mkdir -p dist/test
          if [ "$INCLUDE_TEST" = true ]; then
            test -f preview-source/dist/index.html
            test -f preview-source/dist/pbr-v1/manifest.json
            test -f preview-source/dist/basis/basis_transcoder.wasm
            cp -a preview-source/dist/. dist/test/
            printf '%s\n' '{"serverUrl":""}' > dist/test/network-config.json
            git -C preview-source rev-parse HEAD > dist/test/build-revision.txt
          else
            cat > dist/test/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SECTOR 09 — тестовая версия</title>
          <body style="font:18px system-ui;background:#161c1e;color:#eee;max-width:650px;margin:10vh auto;padding:24px">
          <h1>SECTOR 09</h1><p>Графический ремастер перенесён в основную игру. Отдельная тестовая сборка пока не опубликована.</p>
          <p><a style="color:#9dd8ef" href="../">Открыть основную игру</a></p></body></html>
          HTML
          fi
          node --input-type=module -e '
            import {readFileSync,existsSync} from "node:fs";
            import {resolve} from "node:path";
            const roots=process.env.INCLUDE_TEST==="true"?["dist","dist/test"]:["dist"];
            for(const dir of roots){
              const html=readFileSync(dir+"/index.html","utf8");
              for(const match of html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)){
                const path=match[1];
                if(path.startsWith("/")||!existsSync(resolve(dir,path)))throw Error("Invalid asset path "+dir+": "+path);
              }
            }
            for(const root of roots){
            const m=JSON.parse(readFileSync(root+"/pbr-v1/manifest.json","utf8"));
            for(const [surface,channels] of Object.entries(m.files))
              for(const [channel,sizes] of Object.entries(channels))
                for(const size of sizes)
                  if(!existsSync(root+"/pbr-v1/"+surface+"-"+channel+"-"+size+".ktx2"))
                    throw Error("Missing texture "+root+"/"+surface+"/"+channel+"/"+size);
            }
          '
          touch dist/.nojekyll
          echo "Stable: $(cat dist/build-revision.txt)"
          if [ "$INCLUDE_TEST" = true ]; then echo "Test: $(cat dist/test/build-revision.txt)"; fi
          du -sh dist dist/test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry failed Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
