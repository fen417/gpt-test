name: Verify Sand and Steel campaign screen and mission 2
on:
  push:
    branches:
      - feat/campaign-sand-steel-mission2
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test new mission 2 rules and terrain
        run: node --test test/campaign-mission2.test.js
      - name: Test all gameplay systems
        run: npm test
      - name: Build client
        run: npm run build
