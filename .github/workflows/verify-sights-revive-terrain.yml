name: Verify support sights and campaign rescue
on:
  push:
    branches:
      - fix/mg-mounts-campaign-bleed-and-house
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify clear mounted MG iron sights
        run: node --test test/support-iron-sights.test.js
      - name: Verify campaign revival and ground
        run: node --test test/campaign-rescue-grounding.test.js
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
